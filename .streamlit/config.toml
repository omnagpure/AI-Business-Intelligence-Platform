[theme]
base = "dark"
primaryColor = "#3DA58A"
backgroundColor = "#0B0D10"
secondaryBackgroundColor = "#101318"
textColor = "#E6E8EB"
borderColor = "#232830"
baseRadius = "small"
showWidgetBorder = true
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0B0D10"
secondaryBackgroundColor = "#101318"

[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
